name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Lint only files changed vs the base branch. The repo has pre-existing
      # lint errors on main, so a full src/ check is too noisy for PRs.
      - name: Run Biome on changed files
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch origin "$BASE" --depth=1
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$BASE"...HEAD -- 'src/**/*.ts' 'src/**/*.tsx' | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then
            echo "No source files changed — skipping biome."
          else
            echo "Linting: $CHANGED"
            bunx @biomejs/biome check $CHANGED
          fi

  typecheck:
    name: Type-check (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript
        run: bunx tsc --noEmit --skipLibCheck

  unit-backend:
    name: Unit tests (backend — voip + networking)
    runs-on: ubuntu-latest

    # No external services needed — call-ws.manager.start() is now called
    # explicitly from src/index.ts (no longer at module-load time), so
    # tests can mock redisService cleanly without the singleton subscribing
    # before the mock is in place.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tests in the calls domain and networking are fully mocked (Redis,
      # Postgres, websocket.service). No external services required.
      # We don't run `bun test src/` because the wider repo has unrelated
      # pre-existing test failures and call-summary mock-pollution issues
      # tracked separately.
      # Stub env to satisfy environment.ts validation. All values are dummy —
      # tests mock the actual DB/Redis/external clients, no real I/O happens.
      - name: Run backend tests
        env:
          NODE_ENV: test
          DB_NAME: test
          DB_USER: test
          DB_PASSWORD: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:5173
          COGNITO_USERPOOL_ID: stub
          COGNITO_CLIENT_ID: stub
          STRIPE_SECRET_KEY: stub
          STRIPE_PUBLISHABLE_KEY: stub
          STRIPE_WEBHOOK_SECRET: stub
          STRIPE_PRICE_STARTER_MONTHLY: stub
          STRIPE_PRICE_STARTER_ANNUAL: stub
          STRIPE_PRICE_PROFESSIONAL_MONTHLY: stub
          STRIPE_PRICE_PROFESSIONAL_ANNUAL: stub
          STRIPE_PRICE_ENTERPRISE_MONTHLY: stub
          STRIPE_PRICE_ENTERPRISE_ANNUAL: stub
          POSTMARK_API_KEY: stub
          AWS_REGION: eu-west-3
          AWS_S3_ACCESS_KEY_ID: stub
          AWS_S3_SECRET_ACCESS_KEY: stub
          AWS_S3_BUCKET_NAME: stub
          OPENAI_API_KEY: stub
          ENCRYPTION_KEY: dGVzdGVuY3J5cHRpb25rZXl0ZXN0ZW5jcnlwdGlvbmtleQ==
        run: |
          bun test \
            src/domains/calls/__tests__/call-events.service.test.ts \
            src/domains/calls/__tests__/call-ws.manager.test.ts \
            src/domains/calls/__tests__/voip.websocket.manager.test.ts \
            src/domains/calls/__tests__/voip.security.test.ts \
            src/domains/calls/__tests__/voip.services.test.ts \
            src/domains/calls/__tests__/voip-canary.scheduler.test.ts \
            src/domains/calls/__tests__/integration/voip-signaling.integration.test.ts \
            src/infrastructure/networking/__tests__/turn.utils.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
