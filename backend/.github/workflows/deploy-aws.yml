name: Build and Deploy on Tag

on:
  push:
    tags:
      - 'v*'

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: ortelius-quest-api
  ECR_REGISTRY: 042762504789.dkr.ecr.eu-west-3.amazonaws.com
  K_BASE_REPO: cocom-engineering/k-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042762504789:role/github-actions-role-ortelius-quest-api
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract tag version
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

  update-k-base:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout k-base
        uses: actions/checkout@v4
        with:
          repository: ${{ env.K_BASE_REPO }}
          token: ${{ secrets.K_BASE_TOKEN }}
          path: k-base

      - name: Update image tag and push
        run: |
          cd k-base
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s|image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:.*|image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.version }}|" \
            templates/apps/main/ortelius-quest-api/manifests/rollout.yaml \
            templates/apps/main/ortelius-quest-api/manifests/migration-job.yaml
          git add .
          git diff --staged --quiet || git commit -m "chore(ortelius-quest-api): deploy ${{ needs.build-and-push.outputs.version }}"
          git push || echo "Nothing to push"
