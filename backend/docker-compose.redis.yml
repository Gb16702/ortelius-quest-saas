services:
  # API services (multi-instance example)
  api1:
    build: .
    container_name: ortelius-api-1
    ports:
      - "3001:3000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    restart: unless-stopped

  api2:
    build: .
    container_name: ortelius-api-2
    ports:
      - "3002:3000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    restart: unless-stopped

volumes:
  redis_data: